name: Version check

# Once a week it reads the definitions, asks each channel what it publishes latest, and for every
# counter whose declared version has moved it raises that version, fetches the new build, reads
# its counts and opens a pull request carrying both. It publishes nothing: the version a run
# measures changes only when somebody merges one of these.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  find-what-moved:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.ask.outputs.moved }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features maintenance

      # A channel that could not be answered is a warning and not the end of the run: the counters
      # that did answer still get their pull request, and the one that did not is asked again next
      # week. The document is the whole of stdout, so nothing has to be parsed out of a report.
      - name: Ask every channel what it publishes latest
        id: ask
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          moved=$(./target/release/linebench bump-versions --json)
          asked=$?
          set -e
          # A run that failed before it could report prints nothing at all, and an empty value here
          # is not the empty list: it would pass the gate below and reach fromJSON as a parse error.
          if [ -z "$moved" ]; then moved='[]'; fi
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          echo "$moved"
          if [ "$asked" -ne 0 ]; then
            echo "::warning::a channel could not be asked, and the counters it covers were skipped"
          fi

  raise:
    needs: find-what-moved
    if: needs.find-what-moved.outputs.moved != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    # One job and one pull request per counter, because each raise carries its own counts and its
    # own reading. One failing leaves the others to finish.
    strategy:
      fail-fast: false
      matrix:
        bump: ${{ fromJSON(needs.find-what-moved.outputs.moved) }}

    steps:
      - uses: actions/checkout@v7

      # The branch carries the version, so it is written once and never again. A second run over
      # the same raise finds it there and stops, which is what makes it safe to work on this branch
      # by hand: nothing here will ever force push over what somebody added to it.
      - name: Has this raise been opened already
        id: branch
        run: |
          branch="bump-${{ matrix.bump.counter }}-${{ matrix.bump.to }}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::$branch is already there, so this raise has been opened"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Rust toolchain
        if: steps.branch.outputs.already == 'no'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        if: steps.branch.outputs.already == 'no'
        uses: Swatinem/rust-cache@v2

      - name: Build
        if: steps.branch.outputs.already == 'no'
        run: cargo build --release --features maintenance

      - name: Raise the version this counter declares
        if: steps.branch.outputs.already == 'no'
        run: |
          ./target/release/linebench bump-versions "${{ matrix.bump.counter }}"
          git diff --stat

      # The definitions are compiled into the binary, so until it is built again the raise is a
      # file nobody reads. Everything below measures the version this branch now declares.
      - name: Build again, on the raised definition
        if: steps.branch.outputs.already == 'no'
        run: cargo build --release

      # check times the control once through hyperfine, to say the tool works before a run is
      # paid for, so it is here for the same reason it is in ci.yml.
      - name: Install hyperfine
        if: steps.branch.outputs.already == 'no'
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      # Every counter is fetched, not the raised one alone, because equal work is compared between
      # counters and nothing is compared until two of them have counts.
      - name: Fetch every counter and read the counts back
        if: steps.branch.outputs.already == 'no'
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./target/release/linebench fetch --allow-elevated \
            --counters-dir "${{ runner.temp }}/counters" \
            --counters all
          ./target/release/linebench check linebench \
            --counters-dir "${{ runner.temp }}/counters" \
            --corpus-path "${{ github.workspace }}" | tee "$RUNNER_TEMP/check.txt"
          read=${PIPESTATUS[0]}
          if [ "$read" -eq 0 ]; then
            echo "checked=yes" >> "$GITHUB_OUTPUT"
          else
            echo "checked=no" >> "$GITHUB_OUTPUT"
            echo "::warning::check did not pass under ${{ matrix.bump.counter }} ${{ matrix.bump.to }}"
          fi

      # A pull request opened with the run's own token starts no CI, which github suppresses so
      # that a workflow cannot set itself off. A workflow_dispatch is the one exception it allows,
      # so the run asks for one on the branch and the checks arrive with the pull request.
      - name: Open the pull request
        if: steps.branch.outputs.already == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          COUNTER: ${{ matrix.bump.counter }}
          FROM: ${{ matrix.bump.from }}
          TO: ${{ matrix.bump.to }}
          CHECKED: ${{ steps.check.outputs.checked }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "declare $COUNTER $TO"
          git push -q origin "$BRANCH"
          flags=$(awk '/^same-work +=/ { inside = 1 } inside { print } inside && /\]/ { exit }' \
            "counters/$COUNTER.toml")
          {
            echo "\`$COUNTER\` declared **$FROM**, and its channel now publishes **$TO**. This branch"
            echo "declares the new version, and carries what that build counted, read by the run"
            echo "that opened it."
            echo
            echo "Before merging, read this release for its flags. t1 measures every counter with"
            echo "its ignore files off, and the \`same-work\` line below is what does that. A flag"
            echo "renamed, dropped, or given a new default turns this into two different jobs being"
            echo "timed, and nothing here can see that."
            echo
            echo '```toml'
            echo "$flags"
            echo '```'
            echo
            if [ "$CHECKED" = yes ]; then
              echo "The counts read back and came out equal:"
            else
              echo "**The check did not pass.** What it said:"
            fi
            echo
            echo '```'
            cat "$RUNNER_TEMP/check.txt"
            echo '```'
            echo
            echo "Nothing here will ever be force pushed over: this branch carries the version in"
            echo "its name, so the weekly run sees it and leaves it alone."
          } > "$RUNNER_TEMP/body.md"
          draft=""
          if [ "$CHECKED" = no ]; then draft="--draft"; fi
          gh pr create --head "$BRANCH" --title "declare $COUNTER $TO" \
            --body-file "$RUNNER_TEMP/body.md" $draft
          gh workflow run ci.yml --ref "$BRANCH"
