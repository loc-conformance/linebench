name: Release

on:
  push:
    tags: [ 'v*' ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # crates.io keeps for ever what it is given, and the tag is what names the version everywhere
  # else, so a tag that disagrees with the manifest stops the run before anything is built.
  version:
    name: the tag and the manifest agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare them
        run: |
          manifest=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag=${GITHUB_REF_NAME#v}
          if [ "$manifest" != "$tag" ]; then
            echo "the tag says $tag and Cargo.toml says $manifest"
            exit 1
          fi
          echo "both say $tag"

  build:
    name: build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        uses: Swatinem/rust-cache@v2

      # A tag must never produce a release that does not pass its own gates, and a tag can be
      # pushed from a branch that never went through a pull request
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install hyperfine
        uses: taiki-e/install-action@v2
        with:
          tool: hyperfine

      - name: Test
        run: cargo test --all-features --verbose

      - name: Formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --verbose

      - name: Package for windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "linebench-${{ github.ref_name }}-${{ matrix.platform }}"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item target/release/linebench.exe -Destination $name
          Copy-Item LICENSE-MIT, LICENSE-APACHE, README.md, linebench.conf.example -Destination $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package for linux and macos
        if: runner.os != 'Windows'
        run: |
          name="linebench-${{ github.ref_name }}-${{ matrix.platform }}"
          mkdir "$name"
          cp target/release/linebench "$name/"
          cp LICENSE-MIT LICENSE-APACHE README.md linebench.conf.example "$name/"
          tar czf "$name.tar.gz" "$name"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: linebench-${{ matrix.platform }}
          path: linebench-${{ github.ref_name }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: publish the github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A release already created by hand from the github UI only gains the files and keeps its
      # notes
      - name: Attach the archives to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true

  # Last, because everything above can be run again and this cannot: a version handed to crates.io
  # is there for good, and only a yank ever takes it back.
  crates:
    name: publish to crates.io
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # A tag re-pushed over itself runs this again, where the version is already up and cargo
      # would stop the run over something nobody has to act on.
      - name: Ask crates.io whether it has this version
        id: asked
        run: |
          version=${GITHUB_REF_NAME#v}
          body=$(curl -sS --max-time 30 -H "User-Agent: linebench release workflow" \
            "https://crates.io/api/v1/crates/linebench/$version")
          if echo "$body" | grep -q "\"num\":\"$version\""; then
            echo "held=yes" >> "$GITHUB_OUTPUT"
            echo "crates.io already holds $version, nothing to publish"
          else
            echo "held=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.asked.outputs.held == 'no'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
