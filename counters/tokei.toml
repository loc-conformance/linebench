name         = "tokei"
repository   = "https://github.com/XAMPPRocky/tokei"
version-flag = "--version"
output       = "tokei-json"

[acquisition]
channel = "crates-io"
name    = "tokei"
version = "15.0.0"

[run]
args           = ["{target}"]
json           = ["--output", "json"]
languages      = ["-t", "{names}"]
same-work      = ["--no-ignore"]
same-work-note = "ignore files off, nothing else beyond the counting to turn off"
scrub-env      = ["RAYON_NUM_THREADS"]

[language-names]
c    = "C"
h    = "C Header"
cpp  = "C++"
cc   = "C++"
hpp  = "C++ Header"
hh   = "C++ Header"
java = "Java"
s    = "GNU Style Assembly"
asm  = "Assembly"
py   = "Python"
pl   = "Perl"
pm   = "Perl"
rs   = "Rust"
sh   = "Shell"
bat  = "Batch"
html = "HTML"
js   = "JavaScript"
m    = "Objective-C"
toml = "TOML"
