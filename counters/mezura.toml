name         = "mezura"
repository   = "https://github.com/subamanis/mezura"
version-flag = "--version"
volatile     = ["generated_at", "mezura_version", "performance"]

[acquisition]
channel = "github-release-asset"
name    = "subamanis/mezura"
version = "3.0.0"

[run]
args           = ["{target}"]
json           = ["--output", "json"]
languages      = ["--languages", "{extensions}"]
same-work      = ["--no-gitignore", "--no-ignore-files", "--no-local", "--hide", "keywords",
                  "--count-minified", "--count-generated", "--count-not-code",
                  "--counting", "region",
                  "--no-heuristics"]
same-work-note = "ignore files off, no project settings read, keyword counting off, minified, generated and non code files counted, region counting model, content identification off"
scrub-env      = ["MEZURA_PHASE_TIMING", "CLICOLOR_FORCE"]

[read]
files    = "total.files"
lines    = "total.lines"
code     = "total.code"
comments = "total.comments"
blanks   = "total.blanks"
extra    = "total.extra"
