name         = "cloc"
repository   = "https://github.com/AlDanial/cloc"
version-flag = "--version"
volatile     = ["header.elapsed_seconds", "header.files_per_second", "header.lines_per_second", "header.cloc_version"]

[acquisition]
channel = "github-release-file"
name    = "AlDanial/cloc"
version = "2.10"

[acquisition.file]
windows = "cloc-{version}.exe"
other   = "cloc-{version}.pl"

[run]
args           = ["{target}"]
json           = ["--json"]
languages      = ["--include-ext={extensions}"]
extension-case = "exact"
same-work      = ["--skip-uniqueness"]
same-work-note = "no ignore files of its own to turn off, duplicate file detection off"
scrub-env      = []

[read]
files    = "header.n_files"
lines    = "header.n_lines"
code     = "SUM.code"
comments = "SUM.comment"
blanks   = "SUM.blank"
