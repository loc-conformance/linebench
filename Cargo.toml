[package]
name = "linebench"
version = "0.1.0"
authors = ["Petros Papatheodorou <petrospapa21@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "A benchmark harness for line-of-code counters: every counter on equal work, with the machine's state recorded beside every number"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loc-conformance/linebench"
keywords = ["lines-of-code", "loc", "benchmark", "hyperfine"]
categories = ["development-tools::profiling", "development-tools"]
exclude = [".github"]

[[bin]]
name = "linebench"
path = "src/bin/linebench/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:colored", "dep:ctrlc"]
maintenance = ["cli"]

[dependencies]
colored = { version = "=2.0.0", optional = true }
ctrlc = { version = "3.4", features = ["termination"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = "0.11.0"
toml = { version = "1.1.4", default-features = false, features = ["display", "parse", "serde", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell"] }
